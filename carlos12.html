<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas API</title>
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --primary-color: #1a63a3;
            --secondary-color: #4775e0;
            --terceary-color: #2a39c3;
        }
        body {
            background-color: var(--primary-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        header {
            padding: 16px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--terceary-color);
        }
        .search {
            background-color: white;
            border: 5px solid var(--terceary-color);
            border-radius: 50px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 15px;
            padding: 10px 16px;
            color: black;
        }
        .search::placeholder {
            color: var(--terceary-color);
        }
        .search:focus {
            outline: none;
            background-color: white;
        }
        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .movie {
            width: 300px;
            margin: 15px;
            background-color: var(--secondary-color);
            box-shadow: 0 5px 5px black;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
        }
        .movie img {
            width: 100%;
        }
        .movie-info {
            color: var(--terceary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            padding: 8px 15px 15px;
            letter-spacing: 8px;
        }
        .movie-info h3 {
            margin-top: 0;
        }
        .movie-info span {
            background-color: blue;
            padding: 5px 8px;
            border-radius: 5px;
            font-weight: bold;
        }
        .movie-info span.blue {
            color: rgb(0, 0, 0);
        }
        .movie-info span.orange {
            color: rgb(58, 196, 34);
        }
        .movie-info span.red {
            color: red;
        }
        .overview {
            background-color: #fff;
            padding: 32px;
            position: absolute;
            left: 0px;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 0.3s ease-in;
        }
        .movie:hover .overview {
            transform: translateY(0) ;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo2.jpg" alt="logo" style="width: auto" height="50px">
        <input type="text" id="search" class="search" placeholder="Busca tu película">
    </header>
    <main id="main"></main>

    <script>
        const API_URL = 'https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=3fd2be6f0c70a2a598f084ddfb75487c&page=1';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w1280';
        const SEARCH_API = 'https://api.themoviedb.org/3/search/movie?api_key=3fd2be6f0c70a2a598f084ddfb75487c&query=';

        const main = document.getElementById('main');
        const search = document.getElementById('search');

        getMovies(API_URL);

        async function getMovies(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                showMovies(data.results);
            }  catch (error) {
                console.error('Error fetching data:', error);
            }
        }   
        

        function showMovies(movies) {
            main.innerHTML = '';
            movies.forEach((movie) => {
                const { title, poster_path, vote_average, overview } = movie;
                const movieElement = document.createElement('div');
                movieElement.classList.add('movie');
                movieElement.innerHTML = `
                    <img src="${IMG_PATH + poster_path}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <span class="${getClassByRate(vote_average)}">${vote_average}</span>
                    </div>
                    <div class="overview">
                        <h3>Overview</h3>
                        <p>${overview}</p>
                    </div>
                `;
                main.appendChild(movieElement);
            });
        }

        function getClassByRate(vote) {
            if (vote >= 8) {
                return 'blue';
            } else if (vote >= 5) {
                return 'orange';
            } else {
                return 'red';
            }
        }

        search.addEventListener('input', () => {
            const searchTerm = search.value.trim();
            if (searchTerm) {
                getMovies(SEARCH_API + searchTerm);
            } else {
                getMovies(API_URL);
            }
        });
    </script>
</body>
</html>
