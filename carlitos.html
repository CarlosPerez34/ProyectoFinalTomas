<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            background-image: url('pokemon.png');
        }

        button {
            width: 50px;
            height: 50px;
            background-color: orangered;
            border-color: rgb(255, 135, 135);
            border-radius: 50px;
            position: absolute;
            top: 100px;
            left: 50px;
        }

        button:hover {
            background-color: green;
        }

        .pokeImg {
            background-color: transparent;
        }

        .placeholder {
            width: 200px;
            height: 50px;
            position: absolute;
            border-radius: 10px;
            background-color: transparent;
            text-align: center;
            text-shadow: 2px;
            font-size: 25px;
        }
    </style>

    <input type="text" placeholder="pikachu" id="pokemon" class="placeholder">
    <img src="pokeb.jpg" alt="PokeBall" id="PokeImg" width="300px"> 
    <button onclick="fetchPokemon()" class="button"></button>

    <script>
        const fetchPokemon = () => {
            const pokeNameInput = document.getElementById("pokemon");
            let pokeName = pokeNameInput.value;
            pokeName = pokeName.toLowerCase();

            const url = `https://pokeapi.co/api/v2/pokemon/${pokeName}`;

            fetch(url)
                .then((res) => {
                    if (res.status === 200) {
                        return res.json();
                    } else {
                        console.log("No se encontró el Pokémon");
                    }
                })
                .then((data) => {
                    const pokeImg = document.getElementById("PokeImg");
                    pokeImg.src = data.sprites.front_default; // Cambiar la imagen del Pokémon
                })
                .catch((error) => {
                    console.log("Error en la solicitud:", error);
                });
        };
    </script>
</body>
</html>
